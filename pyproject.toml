[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-lifx-mirror"
version = "2026.10.0"
description = "Home Assistant custom integration for independent LIFX Mirror front and back lights."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2"
dependencies = [
    "homeassistant>=2026.10.0",
    "lifx-async==7.6.5",
]

[project.optional-dependencies]
lint = ["ruff>=0.15.10"]
test = ["pytest==9.0.3", "pytest-asyncio==1.3.0", "pytest-cov==7.1.0"]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff>=0.15.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.lifx_mirror" = [
    "*.json",
    "*.yaml",
    "translations/*.json",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning:homeassistant.components.http",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "D203",   # no-blank-line-before-class (incompatible with formatter)
    "D212",   # multi-line-summary-first-line (incompatible with formatter)
    "COM812", # incompatible with formatter
    "CPY001", # Missing copyright notice
    "DOC201", # Return not in docstring
    "DOC501", # Exception not in docstring
    "FBT001", # Boolean-typed positional argument in function definition
    "FBT002", # Boolean default positional argument in function definition
    "ISC001", # incompatible with formatter
]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "ANN001",
    "ANN202",
    "ARG005",
    "EM101",
    "PLR2004",
    "RUF043",
    "S101",
    "SLF001",
    "TC002",
    "TC003",
]
