set_state:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: lifx_mirror
          multiple: true
    frontlight_hue:
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: degrees
    frontlight_saturation:
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: percent
    frontlight_brightness:
      default: 100
      example: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: percent
    frontlight_kelvin:
      default: 3500
      example: 3500
      selector:
        color_temp:
          min: 1500
          max: 9000
          unit: "kelvin"
    backlight_hue:
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 360
          unit_of_measurement: degrees
    backlight_saturation:
      default: 0
      example: 0
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: percent
    backlight_brightness:
      default: 100
      example: 100
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: percent
    backlight_kelvin:
      default: 3500
      example: 3500
      selector:
        color_temp:
          min: 1500
          max: 9000
          unit: "kelvin"
    transition:
      default: 0
      example: 1
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
